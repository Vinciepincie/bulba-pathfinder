[package]
name = "bulba-pathfinder-core"
version = "0.1.0"
edition = "2021"
description = "wasm A* core for @bulba/pathfinder — consumes the same snapshot buffers as the JS solver, which stays the reference implementation"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true
